<!DOCTYPE html>
<html>
  
<head>
  <title>LiHA.M</title>
  
  <style>
    body {  
      background-color: #16001F;
      color: white;
      text-align: center;
      font-family: "Comic Sans MS", cursive;  
    } 
    
    h3 {
      text-align: left;  
      font-size: 30px;
      padding-left: 40px;
      font: "Trebuchet MS", sans serif;
    }
    
    button {
      background-color: #8A2BE2;
      color: black; 
      border: none;
      padding: 12px 25px;
      border-radius: 15px;
      cursor: pointer;
    }
    button:hover {
      background-color: #B84DFF;
      transform: scale(1.08); 
    }
    button:active {
      transform: scale(0.95);
    }
    
  </style>
    
</head>
  
<body>
  
  <h1>WELCOME TO LiHA.M!</h1>
  <h3>So wala pa'ko mailagay, suggest nga kayo hihi</h3>
  <button onclick="changeText">Button of Absolute Nothing</button> 
  <p id>"message"</p>
  
  <script>
    function changeText() {
      document.getElementById("message").innerHTML=
        "WALA PA NGANI🥀";
    }
  </script>
</body>
  
</html>
